##############################################################################
# GitHub Actions Workflow fuer Moodle-Plugin-Pruefung
# Moodle in Niedersachsen e. V.
#
# Plugin: block_questionfilter
# Ablage: .github/workflows/moodle-ci.yml
#
# Angepasst: PHPUnit mit HTTP-Request-Tests, kein Behat-Schritt.
# templates/ und amd/ sind vorhanden, grunt und mustache bleiben aktiv.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-22.04
    container:
      # Semgrep 1.179.0; immutable image used by the documented local scan.
      image: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (ERROR blocks)
        run: >-
          semgrep scan --config .github/semgrep/moodle-security.yml
          --severity ERROR --error --strict --metrics=off --disable-version-check
          --no-rewrite-rule-ids .

  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'mariadb'
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'

    steps:
      - name: Plugin-Quellcode auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Moodle und Plugin installieren
        run: |
          moodle-plugin-ci add-plugin --branch main Moodle-in-Niedersachsene-V/block_kursfilter
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Webserver für Request-Tests starten
        run: |
          cd moodle
          cat > qf-web-config.php <<'EOF'
          <?php
          // The request test server uses PHPUnit tables and files, never the site data.
          if (getenv('QUESTIONFILTER_WEB_TESTS')) {
              $CFG->prefix = $CFG->phpunit_prefix;
              $CFG->dataroot = $CFG->phpunit_dataroot;
              $CFG->wwwroot = getenv('QUESTIONFILTER_WEB_TESTS');
              unset($CFG->phpunit_prefix, $CFG->phpunit_dataroot);
          }
          EOF
          sed -i "s#^require_once(.*lib/setup.php.*#require_once(__DIR__ . '/qf-web-config.php');\n&#" config.php
          QUESTIONFILTER_WEB_TESTS=http://127.0.0.1:8080 nohup php -S 127.0.0.1:8080 -t public > ../webserver.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/login/index.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../webserver.log
          exit 1

      - name: PHPUnit (inkl. HTTP-Request-Tests)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
        env:
          QUESTIONFILTER_WEB_URL: http://127.0.0.1:8080

      - name: Request-Test-Webserverlog bereitstellen
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webserver-${{ matrix.php }}
          path: webserver.log
          if-no-files-found: ignore

      - name: PHP Lint (Syntaxpruefung)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker (Coding Style)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin-Struktur validieren
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade-Savepoints pruefen
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Grunt (JS/CSS-Lint, AMD-Build-Abgleich)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Mustache-Templates pruefen
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Erzeugte AMD-Build-Dateien bereitstellen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: amd-build-${{ matrix.php }}
          path: moodle/public/blocks/questionfilter/amd/build/
          if-no-files-found: warn
