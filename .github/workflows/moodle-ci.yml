##############################################################################
# GitHub Actions Workflow fuer Moodle-Plugin-Pruefung
# Moodle in Niedersachsen e. V.
#
# Plugin: tiny_textgestaltung
# Ablage: .github/workflows/moodle-ci.yml
#
# Angepasst: kein templates/, kein tests/ vorhanden, daher ohne
# mustache-, phpunit- und behat-Schritt. amd/ ist vorhanden, grunt bleibt.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'mariadb'
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'

    steps:
      - name: Plugin-Quellcode auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Moodle und Plugin installieren
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint (Syntaxpruefung)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker (Coding Style)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin-Struktur validieren
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade-Savepoints pruefen
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Grunt (JS/CSS-Lint, AMD-Build-Abgleich)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Erzeugte AMD-Build-Dateien bereitstellen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: amd-build-${{ matrix.php }}
          path: moodle/public/lib/editor/tiny/plugins/textgestaltung/amd/build/
          if-no-files-found: warn
